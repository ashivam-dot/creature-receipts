<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
@font-face { font-family: Inter; src: url(vendor/InterVariable.woff2) format("woff2"); font-weight: 100 900; }
html, body { margin: 0; width: 1080px; height: 1920px; overflow: hidden; background: #02040a; }
canvas { position: absolute; left: 0; top: 0; }
#labels { position: absolute; left: 0; top: 0; width: 1080px; height: 1920px; pointer-events: none; }
.pin { position: absolute; transform: translate(-50%, calc(-100% - 60px)); text-align: center; font-family: Inter, sans-serif;
  color: #fff; white-space: nowrap; text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9), 0 0 2px #000; }
.pin { background: rgba(6, 10, 20, 0.62); border: 2px solid rgba(255, 255, 255, 0.85); border-radius: 18px;
  padding: 10px 26px 12px; }
.pin .name { font-weight: 800; font-size: 46px; letter-spacing: 1px; text-transform: uppercase; }
.pin .value { font-weight: 900; font-size: 72px; color: #ffd166; line-height: 1.0; font-variant-numeric: tabular-nums; }
.pin .rank { font-weight: 700; font-size: 30px; letter-spacing: 1px; opacity: 0.85; margin-top: 4px; }
.pin .rank:empty { display: none; }
.pin .stem { position: absolute; left: 50%; bottom: -60px; width: 3px; height: 58px; margin-left: -1.5px;
  background: linear-gradient(#fff, rgba(255, 255, 255, 0)); }
.pin.below { transform: translate(-50%, 60px); }
.pin.below .stem { bottom: auto; top: -60px; background: linear-gradient(rgba(255, 255, 255, 0), #fff); }
</style>
<script type="importmap">{ "imports": { "three": "./vendor/three.module.js" } }</script>
</head>
<body>
<div id="labels"></div>
<script type="module" src="globe.js"></script>
</body>
</html>
