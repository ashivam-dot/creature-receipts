name: studio

# The studio's backup. Modal runs the studio four times a day (cloud.studio_run: 11:05, 17:05, 23:05, and 05:05
# IST): each run syncs Buffer, collects Shorts that Modal workers finished, does the daily routine once a day,
# starts workers when fewer than two weeks' worth of Shorts are ready, and schedules finished ones into Buffer.
# This schedule is 2 hours behind Modal's, and a scheduled run does nothing unless Modal's last run failed or is
# over 8 hours old (.github/backup_gate.py). Started by hand, it always runs.
on:
  schedule:
    - cron: "35 1,7,13,19 * * *"
  workflow_dispatch:
    inputs:
      produce:
        description: "Shorts to make (empty: whatever keeps a week waiting)"
        required: false
        default: ""
      publish:
        description: "Schedule finished Shorts into Buffer"
        type: boolean
        default: true
      daily:
        description: "Daily routine (auto: once a day, in the first run after 14:00 IST)"
        type: choice
        options: ["auto", "yes", "no"]
        default: "auto"

concurrency:
  group: studio
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  studio:
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    env:
      # Prompts go to Gemini first, then to other providers' free models (llm.PROVIDERS; one whose key is unset is
      # skipped), and to Cursor's models when none of those can answer (YTC_LLM_FIRST=cursor puts Cursor first).
      # YTC_CURSOR_MODEL pins a Cursor model id.
      YTC_CURSOR_API_KEY: ${{ secrets.YTC_CURSOR_API_KEY }}
      YTC_CURSOR_MODEL: ${{ vars.YTC_CURSOR_MODEL }}
      YTC_LLM_FIRST: ${{ vars.YTC_LLM_FIRST }}
      YTC_GEMINI_API_KEY: ${{ secrets.YTC_GEMINI_API_KEY }}
      YTC_MISTRAL_API_KEY: ${{ secrets.YTC_MISTRAL_API_KEY }}
      YTC_OPENROUTER_API_KEY: ${{ secrets.YTC_OPENROUTER_API_KEY }}
      BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
      BUFFER_YOUTUBE_CHANNEL_ID: ${{ secrets.BUFFER_YOUTUBE_CHANNEL_ID }}
      CLOUDINARY_URL: ${{ secrets.CLOUDINARY_URL }}
      MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
      MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      YTC_CONTACT: ${{ secrets.YTC_CONTACT }}
      # Each Short's 6, 24 and 72 hour review goes to the owner's phone (review.py).
      YTC_NTFY_TOPIC: ${{ secrets.YTC_NTFY_TOPIC }}
      # Stock footage for living-animal beats (sources.stock_videos); a missing key skips that source.
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      # Modal's monthly credit in dollars: 1 on the card-free Starter plan, 30 once a card is on file.
      YTC_MODAL_CREDIT: ${{ vars.YTC_MODAL_CREDIT }}
      HF_HOME: ${{ github.workspace }}/.cache/huggingface
      PYTHONUNBUFFERED: "1"
    steps:
      # The branch's latest commit, not the one this run was triggered on: a run that waited for the one before it
      # must start from the state that run saved, or it would collect and publish the same Shorts again.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}

      - name: Is Modal running the studio?
        id: gate
        if: github.event_name == 'schedule'
        run: python3 .github/backup_gate.py

      # setup-uv publishes exact versions only; there is no v10 tag to follow.
      - uses: astral-sh/setup-uv@v10.2.0
        if: steps.gate.outputs.skip != 'true'
        with:
          working-directory: pipeline
          enable-cache: true
          # Relative to working-directory.
          cache-dependency-glob: uv.lock

      - name: Restore the environment
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: pipeline/.venv
          key: venv-${{ runner.os }}-${{ hashFiles('pipeline/uv.lock') }}

      - name: Restore voice and speech models
        if: steps.gate.outputs.skip != 'true'
        uses: actions/cache@v6
        with:
          path: .cache/huggingface
          key: models-v1

      - name: Install
        if: steps.gate.outputs.skip != 'true'
        working-directory: pipeline
        run: uv sync --frozen

      - name: Google sign-in files
        if: steps.gate.outputs.skip != 'true'
        env:
          YTC_GOOGLE_CLIENT: ${{ secrets.YTC_GOOGLE_CLIENT }}
          YTC_GOOGLE_TOKEN: ${{ secrets.YTC_GOOGLE_TOKEN }}
        run: >-
          python3 -c "import os, pathlib; d = pathlib.Path('secrets'); d.mkdir(exist_ok=True);
          (d / 'client_secret.json').write_text(os.environ['YTC_GOOGLE_CLIENT']);
          (d / 'token.json').write_text(os.environ['YTC_GOOGLE_TOKEN'])"

      - name: Studio run
        if: steps.gate.outputs.skip != 'true'
        working-directory: pipeline
        # Only making Shorts on the runner (when Modal can't be deployed) comes near this.
        timeout-minutes: 170
        env:
          EVENT: ${{ github.event_name }}
          PRODUCE: ${{ inputs.produce }}
          PUBLISH: ${{ inputs.publish }}
          DAILY: ${{ inputs.daily }}
        run: |
          args=(--trigger "$EVENT" --daily "${DAILY:-auto}")
          if [ -n "$PRODUCE" ]; then args+=(--produce "$PRODUCE"); fi
          if [ "$PUBLISH" = "false" ]; then args+=(--no-publish); fi
          uv run --no-sync ytc auto "${args[@]}"

      - name: Save the channel's state
        if: always() && steps.gate.outputs.skip != 'true'
        env:
          EVENT: ${{ github.event_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          git config user.name "History's Last Hours studio"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for path in content strategy reports analytics status; do
            if [ -e "$path" ]; then git add -A "$path"; fi
          done
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git commit -q -m "studio: run $RUN_NUMBER ($EVENT)"
          for attempt in 1 2 3 4 5; do
            if git pull -q --rebase -X theirs && git push -q; then exit 0; fi
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 15))
          done
          exit 1
