name: watchdog

# Checks the studio and the channel's public feed every 3 hours (monitor/monitor.py) and
# pushes each new alert to the owner's phone through ntfy (the YTC_NTFY_TOPIC secret), plus the day's summary on
# its first check after 08:00 IST; running it by hand sends the summary now. It runs here rather than on Modal so
# it keeps watching when Modal is what stopped. Read-only: it changes nothing.
on:
  schedule:
    - cron: "10 */3 * * *"
    - cron: "40 23 3 10 *" # ep054: 4 Oct 2026 05:10 IST, first post-slot check
  workflow_dispatch:

concurrency:
  group: watchdog
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  watch:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      # The alerts already pushed and the day of the last summary, so each reaches the phone once.
      - name: Restore what was already sent
        uses: actions/cache/restore@v6
        with:
          path: |
            monitor/out/seen.json
            monitor/out/job_times.json
            monitor/out/digest.json
          key: watchdog-${{ github.run_id }}
          restore-keys: watchdog-

      - name: Check
        env:
          GH_TOKEN: ${{ github.token }}
          YTC_PUBLIC_MONITOR_ONLY: "1"
          YTC_NTFY_TOPIC: ${{ secrets.YTC_NTFY_TOPIC }}
          YTC_DIGEST_NOW: ${{ github.event_name == 'workflow_dispatch' }}
        run: python3 monitor/monitor.py

      - name: Remember what was sent
        if: always()
        uses: actions/cache/save@v6
        with:
          path: |
            monitor/out/seen.json
            monitor/out/job_times.json
            monitor/out/digest.json
          key: watchdog-${{ github.run_id }}
