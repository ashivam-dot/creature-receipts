id: ep076
title: Britain's Worst Rail Disaster Started With a Shift Change ⚠️
series: The Last Hours
description: On May 22, 1915, signalmen forgot a stationary train on the main line at Quintinshill, triggering a catastrophic
  multi-train collision and fire.
