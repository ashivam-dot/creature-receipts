id: ep044
title: Why Did Gandhi Refuse Guards Before His Assassination? 🤯
series: The Last Hours
description: On January 30, 1948, Mahatma Gandhi was assassinated in New Delhi. Despite surviving a bombing just ten days
  prior, he walked to his prayers without a single guard.
