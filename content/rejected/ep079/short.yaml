id: ep079
title: The Secret Pearl Harbor Disaster They Hid For Decades ⚠️
series: Warnings Ignored
description: On May 21, 1944, a massive explosion at Pearl Harbor's West Loch killed 163 men just before a secret invasion,
  but the military kept the tragedy classified for decades.
