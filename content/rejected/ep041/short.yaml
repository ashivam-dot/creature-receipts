- text: Expanding agriculture drove them to clear the deep-rooted Huarango trees.
  emphasis:
  - agriculture
  - Huarango trees
  visual:
    source: url
    url: https://inaturalist-open-data.s3.amazonaws.com/photos/408669460/original.jpeg
