id: ep032
title: Why Were the Factory Doors Locked in 1911? 🚪
series: Warnings Ignored
description: On March 25, 1911, a fire at the Triangle Shirtwaist Factory in Manhattan trapped hundreds of workers behind
  locked doors, resulting in 146 deaths.
