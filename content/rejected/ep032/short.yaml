- https://www.nps.gov/places/triangle-shirtwaist-factory-brown-building.htm
- https://web.archive.org/web/20170320111038/http://www.pbs.org/wgbh/americanexperience/features/introduction/triangle-intro/
- http://cityroom.blogs.nytimes.com/2011/03/19/in-a-tragedy-a-mission-to-remember/?scp=5&sq=triangle&st=cse/
