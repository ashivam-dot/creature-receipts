id: ep088
title: Why Did the Oppau Fertilizer Plant Explode? ⚠️
series: The Last Hours
description: In 1921, a routine procedure at the BASF Oppau plant triggered one of history's deadliest industrial explosions.
  Discover how a simple manufacturing change turned fertilizer into a massive bomb.
