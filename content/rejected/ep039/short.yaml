id: ep039
title: Why Did the Largest Armada in History Fail? 🤯
series: Warnings Ignored
description: In 1281, the Mongol Empire launched an invasion fleet of 4,400 ships against Japan, only to meet a catastrophic
  end by the legendary Kamikaze typhoon.
