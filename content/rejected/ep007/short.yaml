- text: In August 1914, Canadian veterinarian Lieutenant Harry [Colebourn](/kˈOlbˈɔɹn/) purchased an orphaned black bear cub.
  emphasis:
  - Harry Colebourn
  - orphaned black bear
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/55/Winnie_The_Pet.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Winnie The Pet.jpg
      credit: Unknown, Colebourn Collection
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Winnie_The_Pet.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: He named her Winnipeg after his hometown, and she became the official mascot of the Canadian Army Veterinary Corps.
  emphasis:
  - Winnipeg
  - official mascot
  sfx: riser
  visual:
    reuse: 2
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: The bear sailed across the Atlantic aboard the S.S. Manitou in October 1914 with troops heading to England.
  emphasis:
  - S.S. Manitou
  - October 1914
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: October 1914
      small: Atlantic Ocean
    motion: zoom_in
- text: After living with the troops at Salisbury Plain, [Colebourn](/kˈOlbˈɔɹn/) left Winnie safely at the London Zoo.
  emphasis:
  - Salisbury Plain
  - London Zoo
  visual:
    source: card
    card:
      kind: fact
      big: Salisbury Plain
      small: ''
    motion: zoom_in
- text: There, a young boy named Christopher Robin [Milne](/mˈɪln/) fell in love with the gentle bear.
  emphasis:
  - Christopher Robin Milne
  - gentle bear
  sfx: pop
  pause_after: 0.4
  visual:
    source: card
    card:
      kind: fact
      big: Christopher Robin Milne
      small: ''
    motion: zoom_in
- text: He renamed his own teddy bear in her honor, directly inspiring Winnie-the-Pooh.
  emphasis:
  - teddy bear
  - Winnie-the-Pooh
  sfx: pop
  visual:
    reuse: 1
    motion: zoom_out
