title: How Did Shackleton's Crew Survive the Deadliest Ocean? ⚓
series: Doomed Expeditions
description: In 1916, Sir Ernest Shackleton launched a desperate 800-mile rescue mission in a tiny 22-foot lifeboat. This
  is the incredible story of survival and the James Caird.
