id: ep006
title: 'Sperm Whale: The Loudest Animal on Earth'
series: Nature's Record Breakers
description: The sperm whale produces the loudest clicks on Earth at 236 decibels and has the largest brain of any known animal.
  Its single S-shaped blowhole sits asymmetrically on the left side of its head.
sources:
