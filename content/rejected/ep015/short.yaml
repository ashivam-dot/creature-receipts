- text: They possess eight legs and typically measure less than a single millimeter in length.
  emphasis:
  - eight legs
  - millimeter in length
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/cd/SEM_image_of_Milnesium_tardigradum_in_active_state_-_journal.pone.0045682.g001-2.png/1280px-SEM_image_of_Milnesium_tardigradum_in_active_state_-_journal.pone.0045682.g001-2.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
