    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: When environmental conditions turn harsh, they roll into a tight ball called a [tun](/tˈun/) and completely dry out.
  emphasis:
  - tun
  - dry out
  sfx: riser
  visual:
    source: card
    card:
      kind: fact
      big: TUN STATE
      small: Dehydrated ball
    motion: zoom_in
- text: Inside this glass-like slumber, they can survive temperatures near absolute zero and up to one hundred fifty degrees
    Celsius.
  emphasis:
  - absolute zero
  - one hundred fifty degrees
  sfx: pop
  pause_after: 0.4
  visual:
    reuse: 3
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: They are remarkably the only known animals to successfully endure the harsh vacuum of outer space.
  emphasis:
  - vacuum of outer space
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/96/ISS-59_Waxing_Crescent_Moon_just_above_Earth%27s_limb_%281%29.jpg/3840px-ISS-59_Waxing_Crescent_Moon_just_above_Earth%27s_limb_%281%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: ISS-59 Waxing Crescent Moon just above Earth's limb (1).jpg
      credit: NASA
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:ISS-59_Waxing_Crescent_Moon_just_above_Earth%27s_limb_(1).jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: That is exactly how a microscopic water bear survived a high-speed crash into the Moon.
  emphasis:
  - water bear
  - crash into the Moon
