- text: For many decades, Hollywood movies and popular novels cemented the great white shark as a relentless man-eater.
  emphasis:
  - relentless man-eater
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Carcharodon_carcharias_Kruger.jpg/1280px-Carcharodon_carcharias_Kruger.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
