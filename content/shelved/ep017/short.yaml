      title: Head close-up of a Caribbean Reef Shark at Tiger Beach, Bahamas.jpg
      credit: Dennis Hipp (Zepto)
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Head_close-up_of_a_Caribbean_Reef_Shark_at_Tiger_Beach,_Bahamas.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: When encountering an unfamiliar object like a surfboard, the massive apex predator takes a careful test bite.
  emphasis:
  - careful test bite
  sfx: riser
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/8/81/Carcharodon_carcharias_lower_teeth.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Carcharodon carcharias lower teeth.jpg
      credit: D Ross Robertson
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Carcharodon_carcharias_lower_teeth.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: TEST BITE
      small: Investigating unfamiliar objects
- text: It uses flexible tooth beds and sensitive jaws to gather tactile evidence and figure out what is floating there.
  emphasis:
  - tactile evidence
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/36/Image_from_page_429_of_%22On_the_anatomy_of_vertebrates_%28electronic_resource%29%22_%281866%29_%2814775458213%29.jpg/1280px-Image_from_page_429_of_%22On_the_anatomy_of_vertebrates_%28electronic_resource%29%22_%281866%29_%2814775458213%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
