    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: dateline
      big: '1975'
      small: Cinematic Release
- text: Marine scientists explain that most recorded bites are actually exploratory investigations by curious animals.
  emphasis:
  - exploratory investigations
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9a/Head_close-up_of_a_Caribbean_Reef_Shark_at_Tiger_Beach%2C_Bahamas.jpg/3840px-Head_close-up_of_a_Caribbean_Reef_Shark_at_Tiger_Beach%2C_Bahamas.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
