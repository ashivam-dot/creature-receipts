    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Because human bodies are much too bony and completely lack high-fat blubber, sharks almost always spit us straight
    back out.
  emphasis:
  - spit us straight back out
  sfx: pop
  pause_after: 0.4
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/6/64/Hawaiian_monk_seal_-_Monachus_schauinslandi.jpg/960px-Hawaiian_monk_seal_-_Monachus_schauinslandi.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
