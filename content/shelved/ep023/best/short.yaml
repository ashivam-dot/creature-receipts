    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Starting with the scale of everyday fish, researchers found there are more than two hundred species of anglerfish.
  emphasis:
  - scale of everyday fish
  - two hundred species
  sfx: whoosh
  visual:
    source: card
    card:
      kind: fact
      big: 200+
      small: anglerfish species
    motion: zoom_in
- text: Moving up the ladder, females use a bioluminescent lure on their heads to attract unsuspecting prey.
  emphasis:
  - bioluminescent lure
  - attract unsuspecting prey
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/54/Melanocetus_johnsoni.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
