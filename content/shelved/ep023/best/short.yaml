id: ep023
title: The Deep Sea Fish Where Males Fuse Into Females
series: Deep Sea Files
description: Discover how tiny male deep-sea anglerfish permanently fuse into massive females, dissolving their own organs
  to share a single bloodstream.
sources:
- https://www.nationalgeographic.com/animals/fish/facts/anglerfish
- https://www.smithsonianmag.com/smart-news/Anglerfish-Drop-Their-Immune-Defenses-to-Find-Love-180975458/
- https://utmsi.utexas.edu/science-and-the-sea/radio-program/bright-lure/
- https://en.wikipedia.org/wiki/Anglerfish
- https://yibs.yale.edu/news/sea-love-behind-unusual-sexual-parasitism-deep-water-anglerfish
hashtags:
- '#animals'
- '#deepsea'
- '#anglerfish'
tags:
- anglerfish
- deep sea
- marine biology
- ocean animals
- extreme biology
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Male deep-sea anglerfish dissolve their bodies to survive.
  emphasis:
  - dissolve their bodies
  - survive
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/4d/Caulophryne_pelagica.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
