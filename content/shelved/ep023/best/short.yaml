    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: At the extreme end of the scale, female deep-sea anglerfish can grow up to sixty times the size of the tiny males.
  emphasis:
  - sixty times the size
  - tiny males
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/a/a0/FMIB_52235_Caulophryne_jordani_Goode_%26_Bean_Gulf_Stream_Family_Ceratiidae.jpeg/960px-FMIB_52235_Caulophryne_jordani_Goode_%26_Bean_Gulf_Stream_Family_Ceratiidae.jpeg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
