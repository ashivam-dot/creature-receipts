    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: These massive females can stretch their jaws and stomachs to swallow prey up to twice their own size.
  emphasis:
  - stretch their jaws
  - twice their own size
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/58/Melanocetus_murrayi_%28Murrays_abyssal_anglerfish%29.jpg/1280px-Melanocetus_murrayi_%28Murrays_abyssal_anglerfish%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
