beats:
- text: In Germany, public employee pay takes 5.7% of expenses. In Botswana, it's 54%.
  shot:
    callouts:
    - DEU
    - BWA
- text: Belgium and Spain sit near the bottom at 5.9%.
  shot:
    kind: group
    isos:
    - BEL
    - ESP
- text: The USA spends 8.1% of its budget on civil servants.
  shot:
    kind: country
    iso: USA
- text: Climbing higher, Honduras spends 48.6%, Central African Republic 49.9%, Iraq 51.9%, and Botswana 54%.
  shot:
    kind: rank
    isos:
    - HND
    - CAF
    - IRQ
    - BWA
- text: Mozambique takes the top spot with 62%, the world's highest.
  shot:
    kind: country
    iso: MOZ
- text: Mozambique spends 7.7 times the share that the USA does.
  shot:
    kind: group
    isos:
    - MOZ
    - USA
- text: How much of your government's budget goes to public pay?
  shot:
    kind: card
    lines:
    - YOUR COUNTRY'S SHARE?
