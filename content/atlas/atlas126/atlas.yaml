id: atlas126
title: 'Iraq vs USA: Natural Resource Wealth'
format: versus
hook_text: RESOURCE WEALTH GAP
description: Comparing natural resource rents as a percentage of GDP between Iraq and the USA, based on World Bank
  data.
hashtags:
- '#economy'
- '#geography'
- '#countries'
tags:
- wealth
- natural resource rents as % of gdp
- countries ranked by natural resource rents as % of gdp
- Libya
- Greenland
- world map
- geography
- atlas in numbers
sources:
