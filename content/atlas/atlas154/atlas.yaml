  shot:
    kind: country
    iso: AFG
- text: Look at Brazil, Indonesia, and India. Only one stays below full parity.
  shot:
    kind: group
    isos:
    - BRA
    - IDN
    - IND
- text: Indonesia has 1.02, where literate young women lead.
  shot:
    kind: country
    iso: IDN
- text: Brazil has 1, showing equal literacy between genders.
  shot:
    kind: country
    iso: BRA
- text: India is the odd one out at 0.99, where young men still lead.
  shot:
    kind: country
    iso: IND
- text: Does your country have equal youth literacy between genders?
