id: atlas137
title: The Places With the Highest Adolescent Birth Rates
hook_text: 322 TIMES GAP
description: A global tour of adolescent birth rates shows extreme contrasts, from 161 births per 1,000 women in
  Central African Republic down to 0.5 in North Korea. Data from World Bank, 2024.
hashtags:
