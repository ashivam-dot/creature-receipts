beats:
- text: Central African Republic has 322 times the rate found in North Korea.
  shot:
    callouts:
    - CAF
    - PRK
- text: Central African Republic has the world's highest rate, at 161 births per 1,000 women ages 15 to 19.
  shot:
    kind: country
    iso: CAF
  basis: Adolescent fertility rate is the number of births per 1,000 women ages 15-19.
- text: At the opposite extreme, North Korea has the world's lowest rate at 0.5.
  shot:
    kind: country
    iso: PRK
- text: The USA sits at 12.4 births per 1,000 women, while India has 13.
  shot:
    kind: group
    isos:
    - USA
    - IND
- text: China comes in lower at 5.2 births per 1,000 women.
  shot:
    kind: country
    iso: CHN
- text: Switzerland has 1.5, Kuwait 1.4, Norway 1.3, and Denmark 1.1.
  shot:
    kind: rank
    isos:
    - CHE
    - KWT
    - NOR
    - DNK
- text: What is the adolescent birth rate in your country?
  shot:
    kind: card
    lines:
