beats:
- text: The United States spends 16.7% of its economy on health. Laos spends 1.3%.
  shot:
    callouts:
    - USA
    - LAO
- text: That gives the United States the highest healthcare spending share on Earth.
  shot:
    kind: country
    iso: USA
- text: Compare that to India, which spends 3.3% of its economy on health.
  shot:
    kind: group
    isos:
    - USA
    - IND
- text: This counts healthcare goods and services consumed, excluding capital costs like buildings and machinery.
  basis: Estimates of current health expenditures include healthcare goods and services consumed during each year.
    This indicator does not include capital health expenditures such as buildings, machinery, IT and stocks of vaccines
    for emergency or outbreaks.
- text: Near the top, Afghanistan spends 15%, Germany spends 12.3%, and the UK spends 11.1%.
  shot:
    kind: rank
    isos:
    - AFG
    - DEU
    - GBR
- text: At the very bottom sits Laos, spending just 1.3%.
  shot:
    kind: country
    iso: LAO
- text: How much of your nation's economy goes to healthcare?
  shot:
    kind: card
    lines:
    - How much does your country spend?
    - World Bank Health Expenditure
