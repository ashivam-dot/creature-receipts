id: atlas234
title: How Does the USA Compare on Health Spending?
format: spotlight
hook_text: HEALTH SPENDING GAPS
description: Comparing current health expenditure as a percentage of GDP across nations using World Bank data.
hashtags:
- '#health'
- '#healthcare'
- '#geography'
tags:
- health
- health expenditure as % of gdp
- countries ranked by health expenditure as % of gdp
- United States
- Lao PDR
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/SH.XPD.CHEX.GD.ZS
dataset:
  kind: worldbank
  indicator: SH.XPD.CHEX.GD.ZS
  label: Health expenditure as % of GDP
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 3.0
  - 6.0
  - 9.0
  - 12.0
  labels:
  - Under 3%
  - 3-6%
  - 6-9%
  - 9-12%
  - Over 12%
value_format: '{v:.1f}%'
beats:
- text: The United States spends 16.7% of its economy on health. Bangladesh spends just 2.2%.
  shot:
    callouts:
    - USA
    - BGD
- text: That puts the American system at the very top of global spending.
  shot:
    kind: country
    iso: USA
- text: The United States spends 5.1 times as much as India, where health receives 3.3%.
  shot:
    kind: group
    isos:
    - USA
    - IND
- text: 'Major European economies spend heavy too: Germany sits at 12.3%, Austria at 11.8%, France at 11.5%, and
    the UK at 11.1%.'
  shot:
    kind: rank
    isos:
    - DEU
    - AUT
    - FRA
    - GBR
- text: Yet in Nigeria, current health spending accounts for 4.2% of GDP.
  shot:
    kind: country
    iso: NGA
- text: This counts medical goods and services consumed, excluding capital costs like hospitals or emergency vaccine
    stocks.
  shot:
    kind: country
    iso: USA
  basis: Estimates of current health expenditures include healthcare goods and services consumed during each year.
    This indicator does not include capital health expenditures such as buildings, machinery, IT and stocks of vaccines
    for emergency or outbreaks.
- text: How much of its wealth should a nation dedicate to health?
  shot:
    kind: card
    lines:
    - HEALTH SPENDING
    - Health Expenditure (% of GDP)
