beats:
- text: Turkmenistan generates 100% of its electricity from natural gas, while half the world uses under 3%.
  shot:
    callouts:
    - TKM
- text: It counts the share of electricity production from natural gas sources of total electricity production.
    Gas refers to natural gas but excludes natural gas liquids.
  basis: The share of electricity production from natural gas sources of total electricity production. Sources of
    electricity refer to the inputs used to generate electricity. Gas refers to natural gas but excludes natural
    gas liquids.
- text: Turkmenistan has 34 times India, which uses just 2.9%.
  shot:
    kind: group
    isos:
    - TKM
    - IND
- text: The USA sits at 39.6%, far below the leaders but well above the global middle.
  shot:
    kind: country
    iso: USA
- text: Nigeria is much higher than the USA, with 72.9% of its power from gas.
  shot:
    kind: country
    iso: NGA
- text: At the bottom, Zimbabwe, Zambia, and Uganda produce 0% of their electricity from natural gas.
  shot:
    kind: rank
    isos:
    - ZWE
    - ZMB
    - UGA
- text: Does your country rely on gas for its electricity?
