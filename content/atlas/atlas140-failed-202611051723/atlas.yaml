id: atlas140
title: Which Places Rely Most on Natural Gas for Power?
format: spotlight
hook_text: GAS POWERED NATIONS
description: A global look at the share of electricity production from natural gas sources, highlighting the extreme
  reliance of Turkmenistan versus the global median.
