id: atlas131
title: Which Country Has the MOST Renewable Electricity?
format: odd_one_out
hook_text: CLEAN POWER GAP
description: Renewable electricity is the share of electricity generated by renewable power plants in total electricity
  generated by all types of plants.
hashtags:
- '#energy'
- '#renewableenergy'
- '#geography'
tags:
- energy
- renewable electricity output
- countries ranked by renewable electricity output
- Bhutan
- Turkmenistan
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/EG.ELC.RNEW.ZS
dataset:
  kind: worldbank
  indicator: EG.ELC.RNEW.ZS
  label: Renewable electricity output
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 25.0
  labels:
  - 25% or more
  - Less than 25%
value_format: '{v:.2f}%'
beats:
- text: Over half of all nations generate less than a quarter of their electricity from renewables.
  shot:
    callouts:
    - USA
    - IND
- text: The USA generates 20.3%. It counts power from renewable plants against total electricity generated.
  shot:
    kind: country
    iso: USA
  basis: Renewable electricity is the share of electricity generated by renewable power plants in total electricity
    generated by all types of plants.
- text: 'Which giant is the odd one out: India, Brazil, or China?'
  shot:
    callouts:
    - IND
    - BRA
    - CHN
- text: India generates 19.1%. China has 28.4%.
  shot:
    kind: group
    isos:
    - IND
    - CHN
- text: The answer is Brazil, with 77.4%. That is 4.1 times the renewable electricity India has.
  shot:
    kind: group
    isos:
    - BRA
    - IND
- text: Bhutan generates 100%. Turkmenistan generates just 0.01%.
  shot:
    kind: group
    isos:
    - BTN
    - TKM
- text: What source makes the renewable electricity in your home?
  shot:
    kind: card
    lines:
    - What source makes your power?
    - Renewable Electricity Share
