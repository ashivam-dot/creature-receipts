id: atlas077
title: The World's Most Food-Dependent Exporters
format: rank_ladder
hook_text: EXPORT HUNGER
description: Exploring how much nations rely on food for export revenue, from Belize's 95.3% share to Libya's 0.1%
  share of merchandise exports.
hashtags:
- '#maps'
- '#geography'
- '#globaltrade'
sources:
- https://data.worldbank.org/indicator/TX.VAL.FOOD.ZS.UN
dataset:
  kind: worldbank
  indicator: TX.VAL.FOOD.ZS.UN
  label: Food share of merchandise exports
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 5.0
  - 15.0
  - 35.0
  - 65.0
  labels:
  - Under 5%
  - 5% to 15%
  - 15% to 35%
  - 35% to 65%
  - Over 65%
value_format: '{v:.1f}%'
beats:
- text: Food makes up 95.3% of exports from Belize. In China, it is just 2.3%.
  shot:
    callouts:
    - BLZ
    - CHN
- text: This share counts food, live animals, beverages, tobacco, and oils among all goods sold abroad.
  shot:
    kind: country
    iso: BLZ
- text: 'Other nations rely heavily on farming: Malawi has 93.3%, The Gambia has 90.7%, and Ethiopia has 80.4%.'
  shot:
    kind: rank
    isos:
    - MWI
    - GMB
    - ETH
- text: Major exporters vary. New Zealand has 68.8% while Brazil has 40.7%.
  shot:
    kind: group
    isos:
    - NZL
    - BRA
- text: Libya has 0.1%, the world's lowest. Belize has 953 times the share Libya has.
  shot:
    kind: group
    isos:
    - LBY
    - BLZ
- text: Global giants are lower. India has 11.9% and the USA has 9.0%.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: Where does your country land?
  shot:
    kind: card
    lines:
    - WHO FEEDS THE WORLD?
    - Food Share of Exports (%)
