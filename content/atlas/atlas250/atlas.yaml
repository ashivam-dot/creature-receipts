beats:
- text: 40.2% of women in Serbia use tobacco. In China, it is 1.5%.
  shot:
    callouts:
    - SRB
    - CHN
- text: Bulgaria has 36.7%. Across the Balkans, the habit is widespread.
  shot:
    kind: country
    iso: BGR
- text: In China, only 1.5% of women use tobacco.
  shot:
    kind: country
    iso: CHN
- text: Serbia has 27 times the tobacco use of China.
  shot:
    kind: group
    isos:
    - SRB
    - CHN
- text: The USA has 11.6%. Germany is higher at 19.6%.
  shot:
    kind: group
    isos:
    - USA
    - DEU
- text: Nigeria has 0.4%, Egypt has 0.4%, and North Korea is the world's lowest at 0%.
  shot:
    kind: rank
    isos:
    - NGA
    - EGY
    - PRK
- text: The count includes waterpipes and smokeless tobacco, but excludes e-cigarettes.
  shot:
    kind: country
    iso: SRB
  basis: Tobacco products include cigarettes, pipes, cigars, cigarillos, waterpipes (hookah, shisha), bidis, kretek,
    heated tobacco products, and all forms of smokeless (oral and nasal) tobacco. Tobacco products exclude e-cigarettes
    (which do not contain tobacco), “e-cigars”, “e-hookahs”, JUUL and “e-pipes”.
