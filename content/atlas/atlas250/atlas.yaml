id: atlas250
title: 'Serbia vs China: The Female Tobacco Gap'
format: versus
hook_text: TOBACCO GAP
description: A cinematic comparison of female tobacco use rates in 2024, highlighting the stark contrast between
  Serbia's world-leading rate and the low usage in nations like China and Nigeria.
