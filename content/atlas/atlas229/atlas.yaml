id: atlas229
title: Is INDIA Near the Top for Coal Rents?
format: spotlight
hook_text: NATIONAL COAL RENTS
description: Comparing national economic reliance on coal rents as a share of GDP across major global economies
  using World Bank data.
hashtags:
- '#economy'
- '#geography'
- '#countries'
tags:
- wealth
- coal rents as a share of gdp
- countries ranked by coal rents as a share of gdp
- Mongolia
- Algeria
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/NY.GDP.COAL.RT.ZS
dataset:
  kind: worldbank
  indicator: NY.GDP.COAL.RT.ZS
  label: Coal rents as a share of GDP
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 0.1
  labels:
  - Above 0.1% of GDP
  - 0.1% of GDP or less
value_format: '{v:.5f}%'
beats:
- text: Coal rents make up 1.3% of GDP in India. In the USA, it is just 0.2%.
  shot:
    callouts:
    - IND
    - USA
- text: That puts India near the top among major economies for coal earnings relative to its economy.
  shot:
    kind: country
    iso: IND
- text: It counts the profit margin between world market prices for coal and total production costs.
  shot:
    kind: country
    iso: IND
  basis: Coal rents are the difference between the value of both hard and soft coal production at world prices and
    their total costs of production.
- text: Mongolia hits even higher, where coal rents generate 4.9% of GDP.
  shot:
    kind: country
    iso: MNG
- text: Mozambique follows at 3.8%, South Africa at 2.4%, and India sits at 1.3%.
  shot:
    kind: rank
    isos:
    - MNG
    - MOZ
    - ZAF
    - IND
- text: Meanwhile, Germany stands at 0.01%, and the UK drops to 0.001%.
  shot:
    kind: group
    isos:
    - DEU
    - GBR
- text: How much does coal power the economy in your country?
  shot:
    kind: card
    lines:
    - COAL RENTS
    - Coal rents as a share of GDP (%)
