id: atlas188
title: 'Eswatini vs USA: Dependency on Trade Taxes'
format: versus
hook_text: TRADE TAX GAP
description: A global comparison showing how heavily different nations rely on international trade taxes for public
  revenue.
hashtags:
- '#data'
- '#economy'
- '#geography'
tags:
- trade taxes as % of total revenue
- countries ranked by trade taxes as % of total revenue
- Eswatini
- Bosnia and Herzegovina
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/GC.TAX.INTT.RV.ZS
dataset:
  kind: worldbank
  indicator: GC.TAX.INTT.RV.ZS
  label: Trade taxes as % of total revenue
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 1.0
  - 5.0
  - 10.0
  - 20.0
  labels:
  - Under 1%
  - 1-5%
  - 5-10%
  - 10-20%
  - Over 20%
value_format: '{v:.4f}%'
beats:
- text: Eswatini gets 35.5% of government revenue from trade taxes. The USA gets 1.6%.
  shot:
    callouts:
    - SWZ
    - USA
- text: Eswatini is the world's highest, relying on border customs for over a third of its public funds.
  shot:
    kind: country
    iso: SWZ
- text: The USA relies far less on border customs, taking in just 1.6% of its revenue there.
  shot:
    kind: country
    iso: USA
- text: Side by side, Eswatini depends on trade taxes 22 times as much as the USA.
  shot:
    kind: group
    isos:
    - SWZ
    - USA
- text: Across the globe, the median country collects 4.4% of total revenue from trade taxes.
- text: Bosnia is the world's lowest, drawing just 0.00001% of its revenue from border taxes.
  shot:
    kind: country
    iso: BIH
- text: How much does your country depend on international trade taxes?
  shot:
    kind: card
    lines:
    - BORDER TAX DEPENDENCY
    - Trade Taxes (% of Total Revenue), World Bank
