beats:
- text: Germany's students spend 9 years in secondary school. In the USA, it is just 6.
  shot:
    callouts:
    - DEU
    - USA
- text: This counts the total number of grades a student completes in secondary school.
  shot:
    kind: country
    iso: DEU
  basis: Secondary duration refers to the number of grades (years) in secondary school.
- text: Germany is the world's highest. 9 years of classrooms and study.
  shot:
    kind: country
    iso: DEU
- text: In the USA, that journey is shorter. 6 years.
  shot:
    kind: country
    iso: USA
- text: Germany has 1.5 times the years of schooling you get in the USA.
  shot:
    kind: group
    isos:
    - DEU
    - USA
