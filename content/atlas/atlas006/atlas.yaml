id: atlas006
title: Forest cover across the world in 207 places
hook_text: THE WORLD'S GREENEST
description: A look at the global distribution of forest cover based on World Bank data.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/AG.LND.FRST.ZS
dataset:
  kind: worldbank
  indicator: AG.LND.FRST.ZS
  label: Forest cover, share of land
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 10.0
  - 25.0
  - 40.0
  - 55.0
  - 70.0
  labels:
  - <10%
  - 10-25
  - 25-40
  - 40-55
  - 55-70
  - 70%+
value_format: '{v:.0f}%'
beats:
- text: Suriname leads the world with 94% of its land covered in forest.
  shot:
    callouts:
    - SUR
- text: Dark blue is the lowest coverage, shifting through grey-gold to bright yellow for the highest across 207
    countries and territories.
- text: Forest area is the share of land under natural or planted trees at least 5 meters tall, excluding agriculture
    and urban parks.
- text: Suriname is at 94%, Gabon is at 91%, and Guyana is at 87%.
  shot:
    kind: group
    isos:
    - SUR
    - GAB
    - GUY
- text: The USA is at 34%, India is at 25%, and Japan is at 68%.
  shot:
    kind: rank
    isos:
    - USA
    - IND
    - JPN
- text: At the bottom, Kuwait, Mauritania, and Qatar all record 0%.
  shot:
    kind: group
    isos:
    - KWT
    - MRT
    - QAT
- text: So where does your country rank on the map?
  shot:
    kind: card
    lines:
    - Where is your country?
    - 'Data: World Bank 2021-2023'
