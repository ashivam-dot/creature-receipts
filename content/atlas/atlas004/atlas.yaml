id: atlas004
title: 47 places Where Life Expectancy Reaches 80
hook_text: LIVING PAST 80
description: A global look at where life expectancy at birth meets or exceeds 80 years in 2024.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/SP.DYN.LE00.IN
dataset:
  kind: worldbank
  indicator: SP.DYN.LE00.IN
  label: Life expectancy at birth
  unit: years
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 80.0
  labels:
  - 80+ years
  - Under 80
value_format: '{v:.0f} years'
beats:
- text: Only 47 of 208 countries and territories see babies expected to live past 80.
- text: Yellow shows 80 plus years, while dark blue is under 80.
- text: Life expectancy indicates the number of years a newborn would live if mortality patterns stay the same.
- text: Japan hits 84 years, while Switzerland also reaches 84 years.
  shot:
    kind: group
    isos:
    - JPN
    - CHE
- text: India is at 72 years, and the USA is at 79 years.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: Nigeria sits at 55 years, the world's lowest among these countries.
  shot:
    kind: country
    iso: NGA
- text: So where does your country fall on this map?
  shot:
    kind: card
    lines:
    - Where is your country?
    - World Bank 2024
