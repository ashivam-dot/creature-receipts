id: atlas011
title: Remittances reach 58% of GDP in Tajikistan
hook_text: HIGHEST REMITTANCES
description: Where personal remittances received are large relative to GDP, mapped across 173 countries and territories.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/BX.TRF.PWKR.DT.GD.ZS
dataset:
  kind: worldbank
  indicator: BX.TRF.PWKR.DT.GD.ZS
  label: Remittances received, % of GDP
  unit: '% of GDP'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 1.0
  - 3.0
  - 5.0
  - 10.0
  - 20.0
  labels:
  - <1%
  - 1-3
  - 3-5
  - 5-10
  - 10-20
  - 20%+
value_format: '{v:.0f}%'
beats:
- text: In Tajikistan, personal remittances received reach 58% of gross domestic product.
  shot:
    callouts:
    - TJK
- text: The map uses dark blue for the lowest values, moving through grey-gold to bright yellow for the highest
    across 173 countries and territories.
- text: Tajikistan is the highest at 58%.
  shot:
    kind: country
    iso: TJK
- text: India is 4% and the USA is 0%.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: Personal remittances comprise personal transfers and compensation of employees, counting cash and in kind
    transfers plus income of short-term and border workers.
- text: So where does your country rank on the map?
  shot:
    kind: card
    lines:
    - Where is your country?
    - Remittances received, % of GDP, World Bank
