id: atlas003
title: Below the fertility benchmark in 2024
format: rank_ladder
hook_text: BELOW 2.1
description: An exploration of birth rates across 208 countries and territories using 2024 World Bank data.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/SP.DYN.TFRT.IN
dataset:
  kind: worldbank
  indicator: SP.DYN.TFRT.IN
  label: Births per woman
  unit: births per woman
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 2.1
  labels:
  - 2.1 or more
  - Below 2.1
value_format: '{v:.1f}'
beats:
- text: 113 of 208 mapped countries and territories sit below the 2.1 replacement benchmark.
- text: Yellow marks 2.1 or more and dark blue marks below 2.1, with 113 below that benchmark.
- text: South Korea sits at 0.7 births per woman.
  shot:
    kind: country
    iso: KOR
- text: Nigeria sits at 4.4 births per woman.
  shot:
    kind: country
    iso: NGA
- text: India sits at 2.0 births per woman.
  shot:
    kind: country
    iso: IND
- text: Total fertility rate represents the number of children that would be born to a woman if she were to live
    to the end of her childbearing years and bear children in accordance with age-specific fertility rates of the
    specified year.
- text: So where does your country rank on the map?
  shot:
    kind: card
    lines:
    - So where is your country?
    - Births per woman, World Bank, 2024
