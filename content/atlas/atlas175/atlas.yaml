beats:
- text: Mozambique has 0.2% of adults with a Master's degree. Georgia has 24.9%.
  shot:
    callouts:
    - MOZ
    - GEO
- text: Mozambique is the world's lowest. Very few adults reach this level of study.
  shot:
    kind: country
    iso: MOZ
- text: Global giants are often lower. China has 0.9%, while Japan has 2.5%.
  shot:
    kind: group
    isos:
    - CHN
    - JPN
- text: The USA has 15%. This counts everyone age 25 and over who attained or completed a Master's or equivalent
    degree.
  shot:
    kind: country
    iso: USA
  basis: The percentage of population ages 25 and over that attained or completed Master's or equivalent.
- text: The leaderboard climbs through Poland at 21.4%, Estonia at 21.8%, and Slovakia at 22.3%.
  shot:
    kind: rank
    isos:
    - POL
    - EST
    - SVK
- text: Georgia is among the highest at 24.9%. That is 10 times the rate in Japan.
  shot:
    kind: group
    isos:
    - GEO
    - JPN
- text: How many adults hold a Master's degree where you live?
  shot:
    kind: card
    lines:
    - Master's Degrees
    - Adults with a Master's degree (%)
