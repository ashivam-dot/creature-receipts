id: atlas212
title: 'Primary School Enrollment: Where 100% Is Just the Start'
hook_text: SCHOOL ENROLLMENT GAP
description: An exploration of global primary school enrollment ratios, explaining how some nations exceed 100%
  by counting students of all ages.
hashtags:
- '#education'
- '#geography'
- '#countries'
tags:
- education
- gross primary school enrollment rate
- countries ranked by gross primary school enrollment rate
- Sierra Leone
- Somalia Fed. Rep.
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/SE.PRM.ENRR
dataset:
  kind: worldbank
  indicator: SE.PRM.ENRR
  label: Gross primary school enrollment rate
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 85.0
  - 100.0
  - 115.0
  - 130.0
  labels:
  - Under 85%
  - 85-100%
  - 100-115%
  - 115-130%
  - Over 130%
value_format: '{v:.0f}%'
beats:
- text: Sierra Leone has a gross enrollment ratio of 162%. The USA has 97%.
  shot:
    callouts:
    - SLE
    - SOM
- text: In Sierra Leone, this ratio counts total enrollment, regardless of age, against the official school-age
    population.
  shot:
    kind: country
    iso: SLE
  basis: Gross enrollment ratio is the ratio of total enrollment, regardless of age, to the population of the age
    group that officially corresponds to the level of education shown.
- text: Sierra Leone is the world's highest with a gross enrollment ratio of 162%.
  shot:
    kind: country
    iso: SLE
- text: Somalia is the world's lowest at 21%.
  shot:
    kind: country
    iso: SOM
- text: India has a gross enrollment ratio of 111%. The USA has 97%.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: Rwanda has a gross enrollment ratio of 150%, Malawi has 139%, and Madagascar has 133%.
  shot:
    kind: rank
    isos:
    - RWA
    - MWI
    - MDG
- text: China has 99.6%.
  shot:
    kind: country
    iso: CHN
- text: What is the primary school enrollment rate in your country?
  shot:
    kind: card
    lines:
    - Your country's rate?
    - Gross Primary Enrollment
