value_format: '{v:.0f} years'
beats:
- text: In Turkey, children enter middle school at 10. In Namibia, they wait until 14.
  shot:
    callouts:
    - TUR
    - NAM
- text: In Brazil and the UK, students make that transition at 11.
  shot:
    kind: group
    isos:
    - BRA
    - GBR
- text: This benchmark assumes students entered on time and progressed without repeating any grade.
  basis: assuming they had started at the official entrance age for the lowest level of education, had studied full-time
    throughout and had progressed through the system without repeating or skipping a grade.
- text: Climbing the ladder, the USA, Japan, and China all begin at 12.
  shot:
    kind: rank
    isos:
    - USA
    - JPN
    - CHN
- text: Moving higher, Denmark and Indonesia wait until students reach 13.
  shot:
    kind: group
    isos:
    - DNK
    - IDN
- text: At the very top, Namibia has the world's highest starting age at 14.
  shot:
    kind: country
    iso: NAM
- text: At what age do students enter lower secondary school in your country?
  shot:
    kind: card
    lines:
    - Starting Age?
    - World Bank 2025
