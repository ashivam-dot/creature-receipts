id: atlas247
title: 'Chad vs China: Youth Literacy Rates'
format: versus
hook_text: 33% VS 99%
description: A cinematic comparison of youth literacy rates between Chad and China using latest World Bank data.
hashtags:
- '#education'
- '#geography'
- '#countries'
tags:
