beats:
- text: Qatar has 99.2 percent wage and salaried workers. In Chad, it is 8.4 percent.
  shot:
    callouts:
    - QAT
    - TCD
- text: Qatar is the world's highest. Almost every worker there has a formal employment contract.
  shot:
    kind: country
    iso: QAT
- text: Chad is the world's lowest. Most work for themselves without a steady, basic pay.
  shot:
    kind: country
    iso: TCD
- text: Side by side, Qatar has 12 times the share of paid employees in Chad.
  shot:
    kind: group
    isos:
    - QAT
    - TCD
- text: These workers hold contracts for a basic pay that does not depend on business revenue.
  basis: employment contracts that give them a basic remuneration that is not directly dependent upon the revenue
    of the unit for which they work
- text: Brazil has 69.7 percent. China has 62.3 percent.
  shot:
    kind: group
    isos:
    - BRA
    - CHN
- text: Nigeria has 13.8 percent, Madagascar has 11.7 percent, and Niger 10.5 percent.
  shot:
    kind: rank
    isos:
    - NGA
    - MDG
    - NER
- text: Do you have a formal employment contract?
