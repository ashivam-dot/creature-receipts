- text: India has 83.4%. Brazil has 92.4%.
  shot:
    kind: group
    isos:
    - IND
    - BRA
- text: 'Climbing higher: Germany has 99.2%, USA has 99.6%, and Japan has 99.9%.'
  shot:
    kind: rank
    isos:
    - DEU
    - USA
    - JPN
- text: At 100%, Australia is one of the highest in the world.
  shot:
    kind: country
    iso: AUS
- text: How clean is sanitation in your country?
  shot:
    kind: card
    lines:
    - SANITATION ACCESS
    - People using basic sanitation services (%)
