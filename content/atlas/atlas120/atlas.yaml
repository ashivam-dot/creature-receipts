value_format: '{v:.1f}%'
beats:
- text: In the USA, 97.6% of people have safe drinking water. In Chad, just 6.3%.
  shot:
    callouts:
    - USA
    - TCD
- text: Central African Republic has 6.2%, the world's lowest, far below the USA.
  shot:
    kind: country
    iso: CAF
- text: To count as safe, water must be accessible on premises, available when needed and free from fecal and priority
    chemical contamination.
  shot:
    kind: country
    iso: CAF
  basis: accessible on premises, available when needed and free from fecal and priority chemical contamination
- text: Ranked above the USA, Hungary has 100%, Germany has 99.9%, and the UK has 99.8%.
  shot:
    kind: rank
    isos:
    - HUN
    - DEU
    - GBR
- text: Trailing behind the USA, India has 76.4%, while Nigeria has 29.9%.
  shot:
    kind: group
    isos:
    - IND
    - NGA
- text: Does safe drinking water flow straight from your tap?
  shot:
    kind: card
    lines:
    - Is your tap safe?
    - Safe Drinking Water Access (%)
