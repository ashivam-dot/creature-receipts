id: atlas065
title: Iceland Uses 16,248 kg of Energy Per Person
hook_text: ENERGY USE DIVIDE
description: Energy use per person across 148 countries and territories, from Iceland's world-leading consumption
  to South Sudan, based on World Bank data.
hashtags:
- '#maps'
- '#geography'
- '#energy'
sources:
- https://data.worldbank.org/indicator/EG.USE.PCAP.KG.OE
dataset:
  kind: worldbank
  indicator: EG.USE.PCAP.KG.OE
  label: Energy use per person (kg oil eq.)
  unit: kg oil equivalent
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 500.0
  - 1500.0
  - 3000.0
  - 6000.0
  labels:
  - <500
  - 500–1,500
  - 1,500–3,000
  - 3,000–6,000
  - '>6,000'
value_format: '{v:,.0f} kg'
beats:
- text: A person in Iceland uses 16,248 kg of oil equivalent. South Sudan uses 63.
  shot:
    callouts:
    - ISL
    - SSD
- text: Iceland has the world's highest energy use, far above the median country.
  shot:
    kind: country
    iso: ISL
- text: Qatar is second on the globe at 15,155 kg per person.
  shot:
    kind: country
    iso: QAT
- text: In North America, Canada uses 7,119 kg per resident, while USA uses 6,454.
  shot:
    kind: group
    isos:
    - CAN
    - USA
- text: China uses 2,947 kg, counting primary energy before transformation into other fuels.
  shot:
    kind: country
    iso: CHN
- text: Near the bottom, Nigeria uses 317 kg, far below the global median.
  shot:
    kind: country
    iso: NGA
- text: How much energy does your country use?
  shot:
    kind: card
    lines:
    - Where Do You Stand?
    - Energy use per person (kg oil eq.)
