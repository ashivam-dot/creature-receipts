id: atlas083
title: The Places With the Oldest Male Populations
hook_text: THE WIDE GAP
description: A cinematic look at the global share of men aged 65 and older, highlighting the massive contrast between
  Japan and Qatar.
hashtags:
- '#population'
- '#maps'
- '#geography'
tags:
- population
- share of men aged 65 and above
- Japan
- Qatar
- world map
- data
sources:
