id: atlas228
title: Places Where Women LIVE Into Their 70S
format: versus
hook_text: THE WIDEST GAP
description: In Eastern European nations like Serbia, women aged 70 to 74 account for over 7% of the entire female
  population, compared to under 1% across parts of Africa and the Gulf.
hashtags:
- '#population'
- '#geography'
- '#countries'
tags:
