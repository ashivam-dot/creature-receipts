value_format: '{v:.1f}%'
beats:
- text: In Serbia, 7.4% of women are aged 70 to 74. In the UAE, just 0.6%.
  shot:
    callouts:
    - SRB
    - ARE
- text: Serbia stands at the highest point globally for this age group.
  shot:
    kind: country
    iso: SRB
- text: That means Serbia has 12 times the share found in the UAE.
  shot:
    kind: group
    isos:
    - SRB
    - ARE
- text: Across Eastern Europe, Bosnia has 6.9%, Hungary has 6.8%, and Croatia has 6.7%.
  shot:
    kind: rank
    isos:
    - BIH
    - HUN
    - HRV
- text: The USA sits at 5%.
  shot:
    kind: country
    iso: USA
- text: India has 2.3%, just below the world median of 2.5%.
  shot:
    kind: country
    iso: IND
- text: What share of women in your country are in their 70s?
  shot:
    kind: card
    lines:
    - What is your share?
    - Female population aged 70 to 74
