beats:
- text: In Chad, 96.8% of working women are self-employed. In Qatar, it is 1.2%.
  shot:
    callouts:
    - TCD
    - QAT
- text: Chad leads all nations, running entirely on its own account.
  shot:
    kind: country
    iso: TCD
- text: Qatar sits at the bottom, with 1.2%.
  shot:
    kind: country
    iso: QAT
- text: Chad hits 25 times the USA, which rests at 3.8%.
  shot:
    kind: group
    isos:
    - TCD
    - USA
- text: India hits 78.8% and China hits 35.4%.
  shot:
    kind: group
    isos:
    - IND
    - CHN
- text: The lowest include Denmark at 5.7%, Russia at 5.6%, UAE at 5.2%, and USA at 3.8%.
  shot:
    kind: rank
    isos:
    - DNK
    - RUS
    - ARE
    - USA
- text: What is the female self-employment rate where you live?
  shot:
