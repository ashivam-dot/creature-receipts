id: atlas005
title: 147 of 208 countries are mostly urban
format: rank_ladder
hook_text: MOSTLY CITIES
description: An overview of the share of people living in cities across 208 countries in 2025 based on World Bank
  data.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/SP.URB.TOTL.IN.ZS
dataset:
  kind: worldbank
  indicator: SP.URB.TOTL.IN.ZS
  label: Share of people living in cities
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 50.0
  labels:
  - Mostly urban
  - Mostly rural
value_format: '{v:.0f}%'
beats:
- text: 147 of 208 countries have at least 50% of their people living in cities.
- text: Yellow shows countries at or above 50, and dark blue shows countries below 50.
- text: Kuwait reaches 100% among these countries.
  shot:
    kind: country
    iso: KWT
- text: Papua N. Guinea drops to 16% among these countries.
  shot:
    kind: country
    iso: PNG
- text: India stands at 36%, China sits at 66%, and USA reaches 80%.
  shot:
    kind: rank
    isos:
    - IND
    - CHN
    - USA
- text: Urban population refers to people living in urban areas as defined by national statistical offices.
- text: So where is your country?
  shot:
    kind: card
    lines:
    - So where does your country rank?
    - Share of people living in cities (%), World Bank, 2025
