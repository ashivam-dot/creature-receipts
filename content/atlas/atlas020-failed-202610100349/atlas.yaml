  - 25.0
  - 50.0
  - 75.0
  - 90.0
  labels:
  - <10%
  - 10-25
  - 25-50
  - 50-75
  - 75-90
  - 90%+
value_format: '{v:.0f}%'
beats:
- text: DR Congo draws 96% of its energy from renewables. Qatar sits at 0%.
  shot:
    callouts:
    - COD
    - QAT
