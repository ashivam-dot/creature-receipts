id: atlas020
title: Renewable Share of Energy Use Worldwide
format: rank_ladder
hook_text: THE RENEWABLE GAP
description: Renewable share of total final energy consumption, including biomass where counted, across 206 countries
  and territories.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/EG.FEC.RNEW.ZS
dataset:
