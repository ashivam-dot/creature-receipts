id: atlas182
title: The Places Most Dependent on Their Forests
hook_text: TIMBER ECONOMIES
description: A cinematic look at global forest rents as a percentage of GDP, comparing high-dependence nations like
  Liberia to nations with almost no forest income.
hashtags:
- '#economy'
- '#geography'
- '#countries'
