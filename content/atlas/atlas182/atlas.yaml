beats:
- text: Liberia has 15 times the forest wealth of Nigeria. Nigeria has 1.1 percent.
  shot:
    callouts:
    - LBR
    - NGA
- text: Liberia is one of the highest on the map, at 16.5 percent.
  shot:
    kind: country
    iso: LBR
- text: This counts roundwood harvest times regional prices and rental rates.
  shot:
    kind: country
    iso: LBR
  basis: Forest rents are roundwood harvest times the product of regional prices and a regional rental rate.
- text: At the bottom, the United Kingdom and Turkey have 0 percent.
  shot:
    kind: group
    isos:
    - GBR
    - TUR
