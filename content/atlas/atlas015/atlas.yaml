id: atlas015
title: The Youngest and Oldest places on Earth
hook_text: A WORLD APART
description: 'Median age divides population into two halves of equal size: half are older and half are younger.'
hashtags:
- '#geography'
- '#maps'
- '#population'
sources:
- https://ourworldindata.org/grapher/median-age
dataset:
  kind: owid
  slug: median-age
  column: median_age__sex_all__age_all__variant_estimates
  label: Median age
  unit: years
  source: UN WPP via Our World in Data
  min_year: 2020
scale:
  edges:
  - 20.0
  - 25.0
  - 30.0
  - 35.0
  - 40.0
  labels:
  - <20
  - 20-25
  - 25-30
  - 30-35
  - 35-40
  - 40+
value_format: '{v:.0f}'
beats:
- text: Half of Niger is younger than 15, while half of Japan is older than 49.
  shot:
    callouts:
    - NER
    - JPN
- text: Central African Republic is 14, the lowest of all 219.
  shot:
    kind: country
    iso: CAF
- text: Japan is 49. That is 3.5 times the Central African Republic.
  shot:
    callouts:
    - JPN
    - CAF
- text: China is 39. That is 2.6 times the age of Chad at 15.
  shot:
    kind: group
    isos:
    - CHN
    - TCD
- text: USA is 38. That is 2.5 times Niger.
  shot:
    callouts:
    - USA
    - NER
- text: The oldest? Italy has 47, Portugal has 46, and Germany has 45.
  shot:
    kind: rank
    isos:
    - ITA
    - PRT
    - DEU
- text: India is 28.
  shot:
    kind: country
    iso: IND
- text: Where does your country land?
  shot:
    kind: card
    lines:
    - Where does your country land?
    - Median age in years, UN 2023
