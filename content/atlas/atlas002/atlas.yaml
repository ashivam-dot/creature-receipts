id: atlas002
title: 45 places with Falling Populations
hook_text: 45 PLACES SHRINKING
description: Discover which countries and territories have negative population growth in 2025 according to World
  Bank data.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/SP.POP.GROW
dataset:
  kind: worldbank
  indicator: SP.POP.GROW
  label: Population growth, annual %
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  labels:
  - Growing
  - Shrinking
value_format: '{v:.2f}%'
beats:
- text: Out of 208 countries and territories, 45 have falling populations.
- text: On this map, yellow marks 163 countries and territories growing at or above 0, and dark blue marks 45 shrinking
    countries.
- text: Moldova sits at the bottom, shrinking by 1.75%.
  shot:
    kind: country
    iso: MDA
- text: China is also shrinking by 0.17%, while Japan is shrinking by 0.49%.
  shot:
    kind: group
    isos:
    - CHN
    - JPN
- text: India and the USA are growing, with India at 0.89% and the USA at 0.52%.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: This measures the annual rate of population change by counting all residents, regardless of legal status
    or citizenship.
- text: So where is your country?
  shot:
    kind: card
    lines:
    - So where is your country?
    - World Bank 2025
