beats:
- text: Somalia has 15.3% of young girls. South Korea has just 3.3%.
  shot:
    callouts:
    - SOM
    - KOR
- text: One big country breaks this pattern. It's not the one you'd guess.
  shot:
    callouts:
    - NGA
- text: The USA, China, or Nigeria?
  shot:
    kind: group
    isos:
    - USA
    - CHN
    - NGA
- text: 'Nigeria: 13.3%. That is 3.7 times the young girls Japan has.'
  shot:
    kind: group
    isos:
    - NGA
    - JPN
- text: The world's highest are Somalia, 15.3%, Niger, 15.2%, and Mali, 15.1%.
  shot:
    kind: rank
    isos:
    - SOM
    - NER
    - MLI
- text: It counts the female population between the ages 5 to 9 as a percentage of the total female population.
  shot:
    kind: country
    iso: SOM
  basis: Female population between the ages 5 to 9 as a percentage of the total female population.
- text: The USA has 5.6%. China has 5.4%.
  shot:
    kind: group
    isos:
    - USA
    - CHN
- text: What share of your country's female population are young girls?
