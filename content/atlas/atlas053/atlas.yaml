  - 25.0
  - 50.0
  - 80.0
  labels:
  - Very Low
  - Low
  - Moderate
  - High
  - Very High
value_format: '{v:.1f}%'
beats:
- text: Tertiary enrollment in Greece is 165.1%, while Suriname has just 2.6%.
