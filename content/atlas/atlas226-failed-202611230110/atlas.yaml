id: atlas226
title: How Does the USA Compare on City Sanitation?
format: spotlight
hook_text: URBAN SANITATION GAP
description: Comparing urban safely managed sanitation coverage around the world using World Bank data.
hashtags:
- '#health'
- '#mapstransferred'
- '#geography'
tags:
