id: atlas221
title: Is INDIA Near the Top for Debt Interest?
format: spotlight
hook_text: DEBT INTEREST SPENDING
description: A global look at the percentage of government revenue spent servicing debt interest, based on World
  Bank data.
hashtags:
- '#data'
- '#economics'
- '#geography'
tags:
- interest payments as % of revenue
- countries ranked by interest payments as % of revenue
- Sri Lanka
- Iraq
- world map
- geography
- atlas in numbers
sources:
- https://data.worldbank.org/indicator/GC.XPN.INTP.RV.ZS
dataset:
  kind: worldbank
  indicator: GC.XPN.INTP.RV.ZS
  label: Interest payments as % of revenue
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  edges:
  - 3.0
  - 6.0
  - 13.0
  - 20.0
  labels:
  - < 3%
  - 3-6%
  - 6-13%
  - 13-20%
  - '> 20%'
value_format: '{v:.2f}%'
beats:
- text: Sri Lanka spends 79.9% of its revenue on debt interest. Germany spends 2.5%.
  shot:
    callouts:
    - LKA
    - DEU
- text: Sri Lanka is the world's highest, spending 32 times what Germany does.
  shot:
    kind: group
    isos:
    - LKA
    - DEU
- text: India sits near the top, spending 34% of its revenue on interest.
  shot:
    kind: country
    iso: IND
- text: This counts interest on debt like bonds and loans paid to domestic and foreign residents.
  shot:
    kind: country
    iso: IND
  basis: Interest payments include interest payments on government debt (including long-term bonds, long-term loans,
    and other debt instruments) to domestic and foreign residents.
- text: The USA spends 20.3% of its revenue, right next to Mexico at 20%.
  shot:
    kind: group
    isos:
    - USA
    - MEX
- text: 'Other major economies spend far less: China is at 3.4%, and Russia 2.4%.'
  shot:
    kind: group
    isos:
    - CHN
    - RUS
- text: At the bottom, Iraq spends just 0.01%, the world's lowest.
  shot:
    kind: country
    iso: IRQ
- text: How much of your government's budget goes to paying interest?
  shot:
    kind: card
    lines:
    - DEBT INTEREST SPENDING
    - World Bank, Interest payments (% of revenue)
