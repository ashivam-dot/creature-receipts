id: atlas253
title: Places Ranked by Agricultural Workforce
hook_text: GLOBAL AGRICULTURAL WORKFORCE DIVIDE
description: Comparing the share of total employment in agriculture across countries and territories using World
  Bank data.
hashtags:
- '#work'
- '#economy'
- '#geography'
tags:
- work
- share of total employment
- countries ranked by share of total employment
- Burundi
- Israel
- world map
- geography
- atlas in numbers
sources:
