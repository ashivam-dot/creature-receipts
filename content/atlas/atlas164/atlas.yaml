- text: That puts America right next to the global median of 9.1%.
  shot:
    kind: country
    iso: USA
- text: This evaluates financial strength by comparing core capital to total assets.
  shot:
    kind: country
    iso: USA
  basis: The indicator is a measure of capital adequacy that evaluates the financial strength of deposit takers
    by comparing Tier 1 capital to total assets.
- text: In Asia, India has 8.5%, while China has 7.8%.
  shot:
    kind: group
    isos:
    - IND
    - CHN
