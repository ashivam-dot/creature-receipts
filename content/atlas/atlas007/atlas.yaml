id: atlas007
title: Internet usage across 186 places
hook_text: INTERNET USAGE MAPPED
description: This map shows the share of people who have used the internet in the last 3 months.
hashtags:
- '#maps'
- '#geography'
- '#data'
sources:
- https://data.worldbank.org/indicator/IT.NET.USER.ZS
dataset:
  kind: worldbank
  indicator: IT.NET.USER.ZS
  label: Share of people using the internet
  unit: '%'
  source: World Bank
  min_year: 2019
scale:
  kind: threshold
  at: 50.0
  labels:
  - Most online
  - Most offline
value_format: '{v:.0f}%'
beats:
- text: 143 out of 186 countries and territories have at least 50 percent internet usage.
- text: Yellow areas show 50 percent or more usage, while dark blue areas are below that.
- text: South Sudan has the world's lowest usage at 7 percent.
  shot:
    kind: country
    iso: SSD
- text: Kuwait reaches 100 percent, while Nigeria sits at 41 percent.
  shot:
    kind: group
    isos:
    - KWT
    - NGA
- text: The metric counts individuals who have used the internet from any location in the last 3 months.
- text: Among these countries, India is at 70 percent and the USA is at 95 percent.
  shot:
    kind: group
    isos:
    - IND
    - USA
- text: So where does your country rank?
  shot:
    kind: card
    lines:
    - Where is your country?
    - 'Source: World Bank'
