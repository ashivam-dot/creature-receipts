    motion: pan_right
    focus_x: 0.6
    focus_y: 0.6
- text: Known as the axolotl, this aquatic amphibian keeps its external gills and never leaves the water.
  emphasis:
  - aquatic amphibian
  - keeps its external gills
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/13/Dirty-Lucy.webp?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Dirty-Lucy.webp
      credit: Axolotover
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Dirty-Lucy.webp
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Beyond staying young forever, it can completely regenerate severed limbs, tails, and heart tissue.
  emphasis:
  - completely regenerate
  - severed limbs
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/7/78/Descriptiones_et_icones_amphibiorum_%2819891378912%29.jpg/1280px-Descriptiones_et_icones_amphibiorum_%2819891378912%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Descriptiones et icones amphibiorum (19891378912).jpg
      credit: Wagler, Johann
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Descriptiones_et_icones_amphibiorum_(19891378912).jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Nearly all laboratory pets trace back to a single 1864 shipment sent to Paris.
  emphasis:
  - single 1864 shipment
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: '1864'
      small: Mexico City to Paris
    motion: zoom_in
- text: Yet in the shrinking water channels of Lake [Xochimilco](/zˈOkˈImˈɪlkˈO/), the wild population has crashed.
  emphasis:
  - shrinking water channels
  - population has crashed
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/46/June_2007_Tourism_boating_in_Xochimilco_28.jpg/1920px-June_2007_Tourism_boating_in_Xochimilco_28.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: June 2007 Tourism boating in Xochimilco 28.jpg
      credit: Syced
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:June_2007_Tourism_boating_in_Xochimilco_28.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Invasive fish like tilapia were introduced and eat their eggs, adding to pollution and urban pressure.
  emphasis:
  - Invasive fish
  - eat their eggs
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/51/Tilapia_fish_at_Siantar_Zoo.jpg/3840px-Tilapia_fish_at_Siantar_Zoo.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
