- text: This smiling salamander can regrow its brain, yet it is nearly gone.
  emphasis:
  - regrow its brain
  - nearly gone
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Axolotl-2193331_1280.webp/960px-Axolotl-2193331_1280.webp?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
