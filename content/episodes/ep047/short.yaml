id: ep047
title: How Did the Alamo Fall in About 90 Minutes?
series: The Last Hours
description: Thirty-two men from Gonzales reached the Alamo during its 13-day siege. On March 6, 1836, about 1,800
  Mexican troops stormed its damaged defenses; the final assault lasted no more than 90 minutes. Later paintings
  in the video are labeled as later depictions.
