title: Why Did the Battle of the Alamo Last Only 90 Minutes?
series: The Last Hours
description: The 13-day siege of the Alamo ended in a brutal dawn assault that lasted only 90 minutes. Nearly every defender
  fell before the sun rose over the mission walls.
