id: ep043
title: Custer Split His Cavalry at Little Bighorn. Then What?
series: The Last Hours
description: In June 1876, Custer divided his cavalry near the Little Bighorn. Reno's attack failed, Benteen's effort to reach
  Custer was driven back, and all 210 men in Custer's battalion were killed.
