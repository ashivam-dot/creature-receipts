title: Why Did Custer Ignore the Warnings at Little Bighorn? ⚠️
series: The Last Hours
description: George Custer's 7th Cavalry was annihilated after he ignored his scouts' warnings. This is how Sitting Bull's
  vision of falling soldiers came true.
