id: ep042
title: Why Did the Aztecs Put Out Every Fire in 1507? 😳
series: Fallen Empires
description: In 1507, the Aztec Empire extinguished every flame in Tenochtitlan and waited in darkness for a new fire to be
  lit inside a human sacrifice.
