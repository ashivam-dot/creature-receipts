id: ep041
title: Why Did the Nazca Civilization Cut Down Its Own Desert? 🗿
series: Fallen Empires
description: Discover the tragic mystery of the Nazca civilization, whose reliance on agriculture and clearing of native trees
  led to their sudden collapse after ancient floods.
sources:
- https://en.wikipedia.org/wiki/Nazca_lines
- https://www.smithsonianmag.com/smart-news/scientists-identify-exotic-birds-depicted-perus-mysterious-nazca-lines-180972469/
- https://web.archive.org/web/20190928050205/https://www.nationalgeographic.com/history/archaeology/nasca-lines/
- https://en.wikipedia.org/wiki/Nazca_culture
- http://news.bbc.co.uk/earth/hi/earth_news/newsid_8334000/8334257.stm
hashtags:
- '#history'
- '#nazca'
- '#ancientcivilizations'
tags:
- Nazca Lines
- ancient Peru
- desert collapse
- Huarango trees
- archaeology
voice:
  engine: gemini
  voice: Charon
  direction: 'Read the transcript below aloud as a gripping true-story narrator on a viral YouTube Short: fast and urgent,
    about 170 words a minute, with only tiny pauses, a low, intense voice and rising tension that hits the last line hard.
    Speak only the transcript.'
beats:
- text: The Nazca carved giant lines by clearing the trees holding their desert.
  emphasis:
  - giant lines
  - clearing the trees
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/0/08/Nasca_-_Triangulos_-_panoramio.jpg/3840px-Nasca_-_Triangulos_-_panoramio.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Nasca - Triangulos - panoramio.jpg
      credit: Pavel Špindler
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Nasca_-_Triangulos_-_panoramio.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: Intricate geoglyphs of animals stretched across more than 1,300 kilometers of dry plateau.
  emphasis:
  - Intricate geoglyphs
  - 1,300 kilometers
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/8/84/Nazca_Lines_Hummingbird.jpg/1920px-Nazca_Lines_Hummingbird.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Nazca Lines Hummingbird.jpg
      credit: Unukorno
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Nazca_Lines_Hummingbird.jpg
    fallbacks:
    - card
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 1,300 km
      small: Total length of lines
- text: Expanding maize and cotton agriculture required removing deep-rooted Huarango trees.
  emphasis:
  - maize and cotton
  - Huarango trees
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/f/fd/Starr_050924-4469_Prosopis_pallida.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Starr 050924-4469 Prosopis pallida.jpg
      credit: Forest & Kim Starr
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Starr_050924-4469_Prosopis_pallida.jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: An El Niño event around 500 AD unleashed torrential coastal flooding.
  emphasis:
  - El Niño event
  - torrential coastal flooding
  sfx: riser
  visual:
    source: card
    card:
      kind: dateline
      big: 500 AD
      small: El Niño flooding
    motion: zoom_in
- text: Without root systems, the unprotected soil washed away into deep river channels.
  emphasis:
  - unprotected soil
  - washed away
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/1/12/Puquios_aqueduct_Nazca_Peru.JPG?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
