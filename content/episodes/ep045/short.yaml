id: ep045
title: The Winton Rescue Train That Never Left Prague
series: The Last Hours
description: 'Nicholas Winton and his team helped 669 children reach Britain, but their planned transport for 250
  children was cancelled on 1 September 1939 as Germany invaded Poland. Winton’s scrapbook helped bring the rescue
  story to public attention in 1988. Visual context: Winton portrait, 1938; Prague Main Station aerial, 1931, labeled
  as a location view; Winton memorial at Prague station, photographed in 2015. No scene depicts the cancelled train
  or its children.'
