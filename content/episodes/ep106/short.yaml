id: ep106
title: Why Did the Sky Turn Black on a Sunday in 1935? ⚠️
series: Warnings Ignored
description: On April 14, 1935, a massive dust storm known as Black Sunday displaced 300,000 tons of topsoil and turned day
  into total night.
