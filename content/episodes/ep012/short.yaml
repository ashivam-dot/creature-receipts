id: ep012
title: First live footage of the colossal squid
series: Deep Sea Files
description: For a century, the colossal squid was known only from dead specimens and whale stomachs. On March 9, 2025, researchers
  finally filmed a live juvenile in the South Atlantic.
sources:
- https://en.wikipedia.org/wiki/Colossal_squid
- https://www.sciencedaily.com/releases/2025/04/250416152119.htm
- https://animaldiversity.org/accounts/Mesonychoteuthis_hamiltoni/
- https://www.npr.org/2025/04/15/nx-s1-5364855/colossal-squid-filmed-camera
- https://www.undiscoveredamerica.tv/first-footage-of-a-colossal-squid-rewrites-the-abyss/
- https://scienceblog.com/m-in-march-2025-a-baby-colossal-squid-was-filmed-alive-in-its-natural-habitat-for-the-first-time-a-translucent-animal-about-a-foot-long-drifting-1-968-feet-down-near-the-south-sandwi/
hashtags:
- '#animals'
