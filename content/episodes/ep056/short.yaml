id: ep056
title: How an 1883 Child Disaster Created Emergency Doors 🤯
series: The Last Hours
description: In 1883, a rush for free toys at Victoria Hall in Sunderland turned fatal when an inward-opening door was bolted
  nearly shut. The tragedy killed 183 children and permanently changed emergency exit design worldwide.
