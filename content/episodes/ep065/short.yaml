id: ep065
title: Could Quebec Bridge Workers Have Been Saved? ⚠️
series: Warnings Ignored
description: Quebec Bridge staff measured a growing bend before the 1907 collapse. The Royal Commission did not believe the
  bridge could be saved after August 27, but said better judgment might have prevented the loss of life.
