id: ep065
title: Why Did the Quebec Bridge Collapse in 1907? ⚠️
series: Warnings Ignored
description: The Quebec Bridge collapsed in 1907 after staff measured a growing bend. The Royal Commission did not believe
  the fall could have been prevented after August 27, but said better judgment might have prevented the loss of life.
sources:
- https://archive.org/download/reportandplansa01schngoog/reportandplansa01schngoog_djvu.txt
- https://www.structuremag.org/article/quebec-bridge-the-first-failure-1907/
hashtags:
- '#history'
- '#quebecbridge'
- '#engineering'
tags:
- Quebec Bridge
- 1907 collapse
- engineering failure
- Royal Commission
- St. Lawrence River
voice:
  engine: kokoro
  voice: am_fenrir
  speed: 1.15
beats:
- text: Two days after staff measured a growing bend, the Quebec Bridge collapsed.
  emphasis:
  - growing bend
  - collapsed
  visual:
    source: file
