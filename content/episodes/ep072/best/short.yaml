id: ep072
title: Why Did a Routine Fertilizer Blast Destroy Oppau? 💥
series: The Last Hours
description: On September 21, 1921, workers at the BASF plant in Oppau used small explosive charges to break up caked fertilizer,
  triggering a catastrophic detonation.
