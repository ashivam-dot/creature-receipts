id: ep027
title: Chicago's Cow Was Cleared 126 Years After the Fire
series: The Last Hours
description: The cause of the 1871 Great Chicago Fire remains unknown. Catherine O'Leary was exonerated in 1997, and the famous
  cow story has a disputed history.
