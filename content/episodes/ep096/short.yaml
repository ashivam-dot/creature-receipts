id: ep096
title: Why Did Everyone Think Herculaneum Escaped Vesuvius? 😳
series: Lost Cities
description: For centuries, historians believed the Roman town of Herculaneum escaped the eruption of Mount Vesuvius until
  archaeologists found hundreds of skeletons in the shoreline boathouses.
