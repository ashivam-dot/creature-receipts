title: Why Did Thousands Watch the Burning Ship in Halifax? 😳
series: The Last Hours
description: On December 6, 1917, the SS Mont-Blanc exploded in Halifax harbor after colliding with the SS Imo, causing the
  largest man-made blast before the atomic bomb.
