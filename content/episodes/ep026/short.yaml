id: ep026
title: 'Peshtigo: The Fire Chicago Overshadowed'
series: The Last Hours
description: On October 8–9, 1871, southwest winds drove a firestorm through Peshtigo, Wisconsin, killing an estimated 1,200–2,500
  people. The Great Chicago Fire burned the same night and drew much of the nation’s attention.
sources:
- https://climatology.nelson.wisc.edu/wisconsin-peshtigo-fire/
- https://peshtigofiremuseum.com/fire/chapter-3/
- https://www.weather.gov/grb/peshtigofire
