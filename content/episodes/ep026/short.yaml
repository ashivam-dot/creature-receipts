id: ep026
title: Why History Forgot America's Deadliest Wildfire 😳
series: The Last Hours
description: Discover the true story of the 1871 Peshtigo fire, the deadliest wildfire in American history that was overshadowed
  by the Great Chicago Fire.
sources:
- https://en.wikipedia.org/wiki/Peshtigo_fire
- https://www.missedhistory.com/article/peshtigo-fire-1871-deadliest-wildfire-america
- https://climatology.nelson.wisc.edu/wisconsin-peshtigo-fire/
- https://en.wikipedia.org/wiki/Great_Fires_of_1871
- https://www.history.com/articles/peshtigo-fire-america-deadliest-wildfire
- http://www.smithsonianmag.com/history/what-or-who-caused-the-great-chicago-fire-61481977/
hashtags:
- '#history'
- '#peshtigo'
- '#wildfire'
tags:
- Peshtigo fire
- 1871 disaster
- American history
- Great Chicago Fire
- Wisconsin history
voice:
  engine: gemini
  voice: Charon
  direction: 'Read the transcript below aloud as a gripping true-story narrator on a viral YouTube Short: fast and urgent,
    about 170 words a minute, with only tiny pauses, a low, intense voice and rising tension that hits the last line hard.
    Speak only the transcript.'
