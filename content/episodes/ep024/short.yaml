- text: Narwhals have no functional chewing teeth at all and swallow their deep-sea prey whole.
  emphasis:
  - no functional chewing teeth
  - swallow their deep-sea prey
  visual:
    source: card
    card:
      kind: fact
      big: ZERO
      small: functional teeth
    motion: zoom_in
- text: Instead of eating with it, the male whale channels dental energy into a colossal upper left canine.
  emphasis:
  - upper left canine
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/0/07/Narwhal.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
