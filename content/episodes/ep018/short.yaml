id: ep018
title: The Truth Behind the 2025 Dire Wolf Pups
series: Back From Extinction
description: Colossal Biosciences announced genetically modified gray wolf pups meant to mimic the extinct dire wolf, but
  independent experts argue they are hybrid gray wolves.
