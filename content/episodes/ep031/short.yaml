id: ep031
title: How Did One Man Survive Both Atomic Bombs? 🤯
series: Sole Survivors
description: Tsutomu Yamaguchi is the only person officially recognized as surviving both atomic bombings in 1945. This is
  the story of his survival in Hiroshima and Nagasaki.
