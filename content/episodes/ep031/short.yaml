id: ep031
title: How Did One Man Survive Both Atomic Bombs? 🤯
series: Sole Survivors
description: Tsutomu Yamaguchi survived the Hiroshima and Nagasaki atomic bombings in 1945. Japan later officially
  recognized him as a survivor of both. Archival blast photographs and labeled location cards illustrate the account.
sources:
- https://en.wikipedia.org/wiki/Tsutomu_Yamaguchi
- https://www.missedhistory.com/article/tsutomu-yamaguchi-double-atomic-bomb
- https://news.bbc.co.uk/2/hi/asia-pacific/8443295.stm
- https://web.archive.org/web/20100107034232/http://www.nytimes.com/2010/01/07/world/asia/07yamaguchi.html
- https://www.theguardian.com/world/2009/mar/25/hiroshima-nagasaki-survivor-japan
- https://www.independent.co.uk/news/world/asia/how-i-survived-hiroshima-ndash-and-then-nagasaki-1654294.html
- https://www.npr.org/sections/krulwich/2012/07/17/156915881/if-you-are-hit-by-two-atomic-bombs-should-you-have-kids#:~:text=destroy%20a%20whole%20city?',two%20girls,%20Naoko%20and%20Toshiko.
hashtags:
- '#history'
- '#hiroshima'
- '#nagasaki'
tags:
- Tsutomu Yamaguchi
- atomic bomb
- WWII
- Japan
- survival
- hibakusha
voice:
  engine: gemini
  voice: Charon
  direction: 'Read the transcript below aloud as a gripping true-story narrator on a viral YouTube Short: fast and
    urgent, about 170 words a minute, with only tiny pauses, a low, intense voice and rising tension that hits the
    last line hard. Speak only the transcript.'
