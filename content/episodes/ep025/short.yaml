    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: The hydrogen ignited instantly, killing forty-eight people inside the blazing hull.
  emphasis:
  - ignited instantly
  - killing forty-eight
  sfx: riser
  visual:
    source: card
