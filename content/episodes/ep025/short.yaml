    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.4
- text: Gales over France forced the giant into two steep, fatal dives.
  emphasis:
  - fatal dives
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f4/R101_wreckage.jpg/960px-R101_wreckage.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
