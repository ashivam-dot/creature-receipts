id: ep025
title: 'R101 Disaster: Six Survived, Two Escaped From Inside'
series: Warnings Ignored
description: In 1930, R101 crashed near Beauvais on its first flight to India. Four survivors escaped external engine
  cars; Harry Leech and Arthur Disley came from inside the airship. The precise trigger of the first dive remains
  disputed.
