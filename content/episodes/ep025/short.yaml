    focus_x: 0.5
    focus_y: 0.5
- text: Air Minister Lord [Thomson](/tˈɑmsˈʌn/) boarded despite storm warnings and missed trials.
  emphasis:
  - Lord Thomson boarded
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/c/c4/Christopher_Birdwood_Thomson%2C_1st_Baron_Thomson%2C_in_1926.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
