    focus_y: 0.45
- text: In October 1930, Britain's R101 departed for India on its maiden voyage.
  emphasis:
  - R101 departed
  sfx: whoosh
  visual:
    source: card
    card:
      kind: dateline
      big: October 4, 1930
      small: Cardington, England
    motion: zoom_in
- text: To boost lift, designers had hastily sliced in an extra gas cell.
  emphasis:
  - extra gas cell
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/a/af/R101-framework.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
