id: ep023
title: 'Anglerfish: The Males That Fuse Into Females'
series: Deep Sea Files
description: Discover how tiny male deep-sea anglerfish permanently fuse into massive females, dissolving their own organs
  to share a single bloodstream.
sources:
- https://www.nationalgeographic.com/animals/fish/facts/anglerfish
- https://www.smithsonianmag.com/smart-news/Anglerfish-Drop-Their-Immune-Defenses-to-Find-Love-180975458/
- https://utmsi.utexas.edu/science-and-the-sea/radio-program/bright-lure/
- https://en.wikipedia.org/wiki/Anglerfish
- https://yibs.yale.edu/news/sea-love-behind-unusual-sexual-parasitism-deep-water-anglerfish
- https://news.bbc.co.uk/2/hi/science/nature/4666736.stm
hashtags:
- '#animals'
- '#deepsea'
- '#anglerfish'
tags:
- anglerfish
- deep sea
- marine biology
- extreme nature
- ocean life
- sexual parasitism
voice:
  voice: af_heart
  speed: 1.05
beats:
- text: Male deep-sea anglerfish dissolve their own bodies to survive.
  emphasis:
  - dissolve their own bodies
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/4/4d/Caulophryne_pelagica.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Caulophryne pelagica.jpg
      credit: D. Shale
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Caulophryne_pelagica.jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: In the pitch-black deep sea, finding a mate is nearly impossible for the two hundred known species of anglerfish.
  emphasis:
  - nearly impossible
  - two hundred
  visual:
    source: card
    card:
      kind: fact
      big: 200+
      small: known species
    motion: zoom_in
- text: Females use bioluminescent lures to attract prey and can swallow animals twice their own size.
  emphasis:
  - bioluminescent lures
  - twice their own size
  sfx: whoosh
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/5/54/Melanocetus_johnsoni.png?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: Melanocetus johnsoni.png
      credit: D. ROSS ROBERTSON, ARTURO ANGULO, CAROLE C. BALDWIN, DIANE PITASSY, AMY DRISKELL, LEE WEIGT, IGNACIO J.F. NAVARRO
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Melanocetus_johnsoni.png
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Moving down the ladder, male Photocorynus spiniceps are among the smallest vertebrates at about seven millimeters
    long.
  emphasis:
  - smallest vertebrates
  - seven millimeters
  visual:
    source: card
    card:
      kind: fact
      big: 7 mm
      small: male length
    motion: zoom_in
- text: That makes the massive female up to sixty times larger than her tiny mate.
  emphasis:
  - sixty times larger
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5a/Representatives_of_ceratioid_families.jpg/960px-Representatives_of_ceratioid_families.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Representatives of ceratioid families.jpg
      credit: Masaki Miya et al.
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:Representatives_of_ceratioid_families.jpg
    fallbacks:
    - card
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 60X
      small: size difference
- text: When a male finally finds a female, he latches on with his teeth to begin a permanent transformation.
  emphasis:
  - latches on
  - permanent transformation
  visual:
    reuse: 5
    motion: zoom_in
    focus_x: 0.5
    focus_y: 0.5
- text: His eyes and internal organs slowly wither away until only his reproductive organs remain.
  emphasis:
  - wither away
  - reproductive organs
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/5c/Wissenschaftliche_Ergebnisse_der_Deutschen_Tiefsee-Expedition_auf_dem_Dampfer_%22Valdivia%22_1898-1899_%28Tafel_15%29_%287413862480%29.jpg/1280px-Wissenschaftliche_Ergebnisse_der_Deutschen_Tiefsee-Expedition_auf_dem_Dampfer_%22Valdivia%22_1898-1899_%28Tafel_15%29_%287413862480%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Wissenschaftliche Ergebnisse der Deutschen Tiefsee-Expedition auf dem Dampfer "Valdivia" 1898-1899 (Tafel 15)
        (7413862480).jpg
      credit: Chun, Carl
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Wissenschaftliche_Ergebnisse_der_Deutschen_Tiefsee-Expedition_auf_dem_Dampfer_%22Valdivia%22_1898-1899_(Tafel_15)_(7413862480).jpg
    fallbacks:
    - color
    motion: pan_right
    focus_x: 0.5
    focus_y: 0.5
- text: He can fuse into her body because he lacks the immune genes that would normally reject foreign tissue.
  emphasis:
  - immune genes
  - reject foreign tissue
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/f/f9/A_manual_of_human_physiology%2C_including_histology_and_microscopical_anatomy%2C_with_special_reference_to_the_requirements_of_practical_medicine_%281885%29_%2814758608866%29.jpg/1280px-thumbnail.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: A manual of human physiology, including histology and microscopical anatomy, with special reference to the requirements
        of practical medicine (1885) (14758608866).jpg
