id: ep038
title: The B-25 That Struck the Empire State Building 🤯
series: The Last Hours
description: On July 28, 1945, a B-25 struck the Empire State Building in fog. Elevator operator Betty Lou Oliver
  survived a 75-floor plunge. Records confirm the survival but do not establish why the fall was survivable. Archival
  crash photos and a labeled representative aircraft image illustrate the account.
