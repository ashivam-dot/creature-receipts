- https://www.archives.nyc/blog/2019/10/18/the-empire-state-plane-crash-july-28-1945
- https://www.npr.org/2008/07/28/130328215/empire-state-building-the-day-a-bomber-crashed-into-the-79th-floor
- https://web.archive.org/web/20170729060821/http://www.nytimes.com/1995/07/28/nyregion/flaming-horror-79th-floor-50-years-ago-today-fog-plane-hit-world-s-tallest.html
