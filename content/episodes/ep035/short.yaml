id: ep035
title: The Galveston Warning Before America's Deadliest Storm
series: The Last Hours
description: Isaac Cline raised hurricane flags and warned Galveston residents before the 1900 storm. Its surge overwhelmed
  the low island and killed more than 8,000 people.
sources:
- https://www.nhc.noaa.gov/news/NOAApr10.html
- https://vlab.noaa.gov/web/nws-heritage/-/isaac-monroe-cline-the-cyclone-pioneer
