id: ep073
title: Why Was the Boston Molasses Tank Painted Brown? ⚠️
series: Warnings Ignored
description: In 1919, a massive molasses tank in Boston's North End exploded, sending a deadly wave through the streets. The
  owners had ignored the leaks, choosing to hide them with paint instead.
sources:
- https://en.wikipedia.org/wiki/Great_Molasses_Flood
- https://historydecoded.co.uk/articles/molasses-flood
- https://www.theguardian.com/us-news/2019/jan/13/the-great-boston-molasses-flood-why-it-matters-modern-regulation
- https://werehistory.org/preventing-another-boston-molasses-disaster/
hashtags:
- '#history'
- '#boston'
- '#molassesflood'
tags:
- Great Molasses Flood
- Boston history
- '1919'
- industrial disaster
- North End Boston
- Warnings Ignored
