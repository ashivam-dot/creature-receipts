id: ep090
title: Why Did a Wealthy Texas School Use Free Waste Gas? ⚠️
series: The Last Hours
description: On March 18, 1937, a massive natural gas explosion destroyed the New London School in Texas, killing nearly 300
  students and teachers and changing safety laws forever.
