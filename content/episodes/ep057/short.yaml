id: ep057
title: Why Was France’s Deadliest Train Crash Kept Secret? ⚠️
series: Warnings Ignored
description: The 1917 Saint-Michel-de-Maurienne derailment remains the deadliest rail disaster in French history. Discover
  how a series of ignored warnings and military blunders was kept hidden for 90 years.
