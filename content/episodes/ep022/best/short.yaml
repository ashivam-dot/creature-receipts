- text: An octopus has three beating hearts and bright blue copper-based blood.
  emphasis:
  - three beating hearts
  - blue copper-based blood
  sfx: whoosh
  visual:
    source: url
    url: https://inaturalist-open-data.s3.amazonaws.com/photos/540103051/original.jpg
    credit:
      source: iNaturalist
