    focus_x: 0.5
    focus_y: 0.5
- text: Stepping up in scale from single-heart creatures, this soft-bodied marine genius lacks bones entirely to squeeze through
    tiny gaps.
  emphasis:
  - stepping up
  - lacks bones entirely
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/4/44/Enteroctopus_dofleini_in_aquarium_crop.jpg/960px-Enteroctopus_dofleini_in_aquarium_crop.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
