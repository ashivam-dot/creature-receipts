      title: Enteroctopus dofleini in aquarium crop.jpg
      credit: 'Enteroctopus_dofleini_in_aquarium.jpg: Bachrach44

        derivative work: The High Fin Sperm Whale'
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Enteroctopus_dofleini_in_aquarium_crop.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Climbing higher along the biological scale, the entire animal possesses around five hundred million total neural connections.
  emphasis:
  - climbing higher
  - five hundred million
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/b/be/The_Cephalopoda_%28Plate_LXXVI%29_%286140286962%29.jpg/1280px-The_Cephalopoda_%28Plate_LXXVI%29_%286140286962%29.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: The Cephalopoda (Plate LXXVI) (6140286962).jpg
      credit: Chun, Carl
      license: CC BY 2.0
      url: https://commons.wikimedia.org/wiki/File:The_Cephalopoda_(Plate_LXXVI)_(6140286962).jpg
    fallbacks:
    - color
    motion: pan_down
    focus_x: 0.5
    focus_y: 0.5
- text: Reaching the absolute peak of the scale, two-thirds of those massive neurological counts live directly inside its
    eight arms.
  emphasis:
  - absolute peak
  - two-thirds
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/9/98/%D0%A0%D1%83%D0%BA%D0%B0_%D0%BC%D0%BE%D1%80%D1%81%D0%BA%D0%BE%D0%B3%D0%BE_%D0%BF%D1%80%D0%B8%D0%BC%D0%B0%D1%82%D0%B0.jpg/3840px-%D0%A0%D1%83%D0%BA%D0%B0_%D0%BC%D0%BE%D1%80%D1%81%D0%BA%D0%BE%D0%B3%D0%BE_%D0%BF%D1%80%D0%B8%D0%BC%D0%B0%D1%82%D0%B0.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
