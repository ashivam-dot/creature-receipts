  voice: af_heart
  speed: 1.05
beats:
- text: An octopus has three beating hearts and bright blue copper-based blood.
  emphasis:
  - three beating hearts
  - blue copper-based blood
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/3/32/Octopus_vulgaris_Merculiano.jpg/1280px-Octopus_vulgaris_Merculiano.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Octopus vulgaris Merculiano.jpg
      credit: Comingio Merculiano (1845-1915) in Jatta Giuseppe (1860-1903)
      license: Public domain
      url: https://commons.wikimedia.org/wiki/File:Octopus_vulgaris_Merculiano.jpg
    fallbacks:
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
- text: Stepping up from a single heart, this creature lacks bones entirely and can squeeze through gaps the size of a coin.
  emphasis:
  - lacks bones
  - size of a coin
  sfx: whoosh
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/5/52/Enteroctopus_dofleini_in_aquarium_rotated.jpg/1920px-Enteroctopus_dofleini_in_aquarium_rotated.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Enteroctopus dofleini in aquarium rotated.jpg
      credit: User:Bachrach44
      license: CC0
      url: https://commons.wikimedia.org/wiki/File:Enteroctopus_dofleini_in_aquarium_rotated.jpg
    fallbacks:
    - color
    motion: pan_left
    focus_x: 0.5
    focus_y: 0.5
- text: Moving up the ladder of complexity, the entire animal possesses around five hundred million total neurons.
  emphasis:
  - ladder of complexity
  - five hundred million
  visual:
    source: url
    url: https://upload.wikimedia.org/wikipedia/commons/d/dc/PLoSBiol4.e126.Fig6fNeuron.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail_unscaled
    credit:
      source: Wikimedia Commons
      title: PLoSBiol4.e126.Fig6fNeuron.jpg
      credit: Wei-Chung Allen Lee, Hayden Huang, Guoping Feng, Joshua R. Sanes, Emery N. Brown, Peter T. So, Elly Nedivi
      license: CC BY 2.5
      url: https://commons.wikimedia.org/wiki/File:PLoSBiol4.e126.Fig6fNeuron.jpg
    fallbacks:
    - card
    - color
    motion: zoom_out
    focus_x: 0.5
    focus_y: 0.5
    card:
      kind: fact
      big: 500 MILLION
      small: Total neurons
- text: Climbing to the peak of biological weirdness, two-thirds of those cells live directly inside its eight arms.
  emphasis:
  - peak
  - inside its eight arms
  sfx: riser
  visual:
    source: url
    url: https://thumb.wikimedia.org/wikipedia/commons/thumb/c/c3/Img_octopus_arm_and_suckers_057513.jpg/1920px-Img_octopus_arm_and_suckers_057513.jpg?utm_source=commons.wikimedia.org&utm_campaign=imageinfo&utm_content=thumbnail
    credit:
      source: Wikimedia Commons
      title: Img octopus arm and suckers 057513.jpg
      credit: Henryhartley
      license: CC BY 3.0
      url: https://commons.wikimedia.org/wiki/File:Img_octopus_arm_and_suckers_057513.jpg
    fallbacks:
    - color
    motion: pan_up
    focus_x: 0.5
    focus_y: 0.5
- text: Because each arm contains more neurons than many small mammals, it can taste, touch, and move without the central
    brain.
  emphasis:
  - taste, touch, and move
  - without the central brain
  visual:
    source: url
    url: https://cdn.pixabay.com/video/2023/02/27/152482-802877601_large.mp4
    credit:
      source: Pixabay
      title: Octopus, underwater, sea, coconut octopus, ocean, nature, animal
      credit: mr-sragenesia
      license: Pixabay Content License
      url: https://pixabay.com/videos/id-152482/
    fallbacks:
    - color
    motion: none
    focus_x: 0.5
    focus_y: 0.5
- text: This decentralized mind lets veined octopuses walk their arms to collect discarded coconut shells for portable shelter.
  emphasis:
  - decentralized mind
  - coconut shells
  sfx: pop
